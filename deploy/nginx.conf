# The frontend container: the page as a static file, everything else to the gateway.
# No build step, so this is the whole of the frontend's deployment.
server {
    listen 80;
    client_max_body_size 64m;       # a contour sheet upload, matching the API's own limit

    root /usr/share/nginx/html;
    location = / { try_files /index.html =404; add_header Cache-Control "no-store"; }

    location ~ ^/(api|docs|openapi.json|health|static)(/|$) {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;    # a synchronous analysis on a busy cluster
    }
}
