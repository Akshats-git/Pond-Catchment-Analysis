# The whole stack with one `docker compose up`.
#
#   frontend  nginx, the page, :8080 on the host
#   api       the gateway: jobs, cache, dispatch, saved
#   worker1-3 analyses, one at a time each               
#   cv        imagery: existing water, land availability
#   otel      Grafana's all-in-one OpenTelemetry backend: collector, Tempo (traces),
#             Prometheus (metrics), Loki (logs) and Grafana on :3000
#   pond-db   the saved-analyses database, a SQLite file on a named volume
#
#
# Every service is capped at 512 MB, the memory of Render's free tier, so what runs
# here fits the live demo too.

x-pond: &pond
  build: .
  image: pond-catchment:latest
  restart: unless-stopped
  mem_limit: 512m
  environment: &pond-env
    POND_CV_SERVICE_URL: http://cv:5000
    POND_JOBS_WORKERS: ""
    # Telemetry goes to the `otel` service below. Unset this to run with it switched off.
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel:4318}

services:
  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports: ["8080:80"]
    volumes:
      - ./static:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]

  api:
    <<: *pond
    environment:
      <<: *pond-env
      POND_JOBS_WORKERS: ${POND_WORKERS:-http://worker1:5000,http://worker2:5000,http://worker3:5000}
      POND_JOBS_STRATEGY: ${POND_JOBS_STRATEGY:-least_busy}
    # No host port: everything reaches it through the frontend on 8080.
    volumes: ["pond-db:/data"]
    depends_on: [worker1, worker2, worker3, cv]

  worker1: { <<: *pond, volumes: ["tiles1:/srv/pond/.cache"] }
  worker2: { <<: *pond, volumes: ["tiles2:/srv/pond/.cache"] }
  worker3: { <<: *pond, volumes: ["tiles3:/srv/pond/.cache"] }

  cv:
    <<: *pond
    command: ["uvicorn", "app.cv.service:app", "--host", "0.0.0.0", "--port", "5000", "--workers", "1"]

  # Not part of the 512 MB envelope: this is the observability tooling, not the app.
  otel:
    image: grafana/otel-lgtm:0.41.0
    restart: unless-stopped
    ports: ["3000:3000"]
    volumes: ["otel-data:/data"]

volumes:
  otel-data:
  pond-db:
  tiles1:
  tiles2:
  tiles3:
