<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pond Catchment Analysis</title>
<!--
  The demo page. One file, no build step, no CDN, so it runs from a file:// URL and on a
  container with nothing installed. The only network calls are to this service and to the
  tile servers credited under the map.

  The map is a plain slippy map: Web Mercator tiles moved by one CSS transform, and the
  API's GeoJSON reprojected into an SVG overlay in screen coordinates each frame. Screen
  space rather than a scaled group, because a scaled group scales stroke widths with it.

  Feature colours come from the simplestyle properties the API emits, so this page and
  geojson.io draw the same picture from one source, app/core/geojson.py.

  Three inputs are asked for: the file, the land cover, the pond depth. Rainfall, grid
  size and the pour point are worked out from the sheet unless the Advanced panel
  overrides them.
-->
<style>
  :root {
    color-scheme: light dark;

    --ink: #101a22;
    --ink-soft: #40525f;
    --muted: #6b7c89;
    --line: #dfe6ec;
    --line-soft: #edf2f6;
    --bg: #eef2f5;
    --panel: #ffffff;
    --raised: #f7fafc;
    --head: #0d1a24;
    --head-ink: #ffffff;
    --head-muted: #9db1c0;

    --accent: #1f78b4;
    --accent-deep: #0b4f8a;
    --accent-wash: #eaf4fb;
    --on-accent: #ffffff;
    --good: #157a45;
    --good-wash: #e2f5ea;
    --warn: #96560a;
    --warn-wash: #fdf2e2;
    --bad: #b3261e;
    --bad-wash: #fdeceb;

    --radius: 9px;
    --radius-sm: 6px;
    --shadow: 0 1px 2px rgba(13, 26, 36, .08), 0 6px 18px rgba(13, 26, 36, .10);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8eef3;
      --ink-soft: #b3c2ce;
      --muted: #8397a5;
      --line: #27343d;
      --line-soft: #1d272e;
      --bg: #0d151b;
      --panel: #131d24;
      --raised: #18242c;
      --head: #0a1218;
      --head-ink: #f2f6f9;
      --head-muted: #7d93a3;

      --accent: #4ea3dc;
      --accent-deep: #7cc0ec;
      --accent-wash: #14293a;
      --on-accent: #07202f;
      --good: #6ddc9c;
      --good-wash: #12301f;
      --warn: #edb668;
      --warn-wash: #33240f;
      --bad: #f28b83;
      --bad-wash: #351816;

      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .38);
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-deep); }
  h2, h3 { margin: 0; }

  /* ---------------- header ---------------- */
  header {
    background: var(--head); color: var(--head-ink); padding: 0 16px; height: 46px;
    display: flex; align-items: center; gap: 10px; flex: none;
  }
  header .mark {
    width: 22px; height: 22px; border-radius: 6px; flex: none;
    background: linear-gradient(150deg, #3d9ad4, #0b4f8a); display: grid; place-items: center;
  }
  header .mark svg { width: 14px; height: 14px; }
  header h1 { font-size: 14.5px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  header a { color: #a9d3ee; text-decoration: none; font-size: 12.5px; }
  header a:hover { text-decoration: underline; }
  #health { font-size: 12.5px; color: var(--head-muted); display: flex; align-items: center; gap: 7px; }
  #health .dot { width: 7px; height: 7px; border-radius: 50%; background: #64748b; flex: none; }
  #health.up .dot { background: #4ade80; }
  #health.down .dot { background: #f87171; }

  /* ---------------- setup bar ---------------- */
  #bar {
    flex: none; position: relative; z-index: 20; display: flex; align-items: flex-end;
    gap: 14px; flex-wrap: wrap; padding: 9px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #bar .spacer { flex: 1; min-width: 0; }
  .ctl { display: flex; flex-direction: column; gap: 4px; }
  .ctl > .lbl {
    font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); font-weight: 700;
  }
  input[type=number], input[type=text], select {
    font: inherit; font-size: 13px; padding: 6px 8px; height: 32px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    color: var(--ink); background: var(--panel); appearance: none;
  }
  select { cursor: pointer; padding-right: 26px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: right 12px center, right 7px center;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
  }
  .unit { position: relative; display: inline-flex; align-items: center; }
  .unit input { padding-right: 26px; }
  .unit i { position: absolute; right: 9px; font-style: normal; font-size: 12px; color: var(--muted); }

  button.btn {
    font: inherit; font-size: 13px; height: 32px; padding: 0 12px;
    border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius-sm);
    cursor: pointer; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 7px;
  }
  button.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-deep); }
  button.btn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.btn:disabled { opacity: .5; cursor: not-allowed; }
  button.btn svg { width: 14px; height: 14px; }
  button.primary {
    font: inherit; font-size: 13.5px; font-weight: 600; height: 32px; padding: 0 18px;
    border: 0; border-radius: var(--radius-sm); cursor: pointer;
    color: var(--on-accent); background: var(--accent-deep);
  }
  button.primary:hover:not(:disabled) { background: var(--accent); }
  button.primary:disabled { background: var(--muted); opacity: .45; cursor: not-allowed; }

  #filechip {
    display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 11px;
    border: 1px solid var(--accent); background: var(--accent-wash); color: var(--accent-deep);
    border-radius: var(--radius-sm); font-size: 13px; max-width: 260px;
  }
  #filechip .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #filechip .size { color: var(--muted); font-size: 11.5px; flex: none; }
  #filechip .x {
    border: 0; background: none; cursor: pointer; color: inherit; font-size: 16px;
    line-height: 1; padding: 2px 4px; opacity: .65;
  }
  #filechip .x:hover { opacity: 1; }

  /* advanced popover */
  .adv-wrap { position: relative; }
  #adv {
    position: absolute; top: calc(100% + 8px); left: 0; z-index: 30;
    width: min(300px, calc(100vw - 28px));
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px;
  }
  #adv .f { margin-bottom: 13px; }
  #adv .f:last-child { margin-bottom: 0; }
  #adv label.k {
    display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px;
  }
  #adv input[type=number] { width: 100%; }
  #adv .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #adv .sub { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
  #adv .check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  #adv .check input { accent-color: var(--accent); margin: 0; }
  #adv .check input:disabled + span { color: var(--muted); }
  #adv hr { border: 0; border-top: 1px solid var(--line-soft); margin: 13px 0; }
  #adv .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #adv code {
    font-size: 11.5px; color: var(--accent-deep); background: var(--accent-wash);
    padding: 3px 7px; border-radius: 5px;
  }

  #derived { font-size: 12px; color: var(--muted); padding-bottom: 7px; }
  #derived b { color: var(--ink-soft); font-weight: 600; }
  #prog { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; display: none; }
  #prog.on { display: block; }
  #prog i { display: block; height: 100%; width: 30%; background: var(--accent); animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(430%); } }

  /* ---------------- layout ---------------- */
  main { flex: 1; display: flex; min-height: 0; }
  #map {
    position: relative; flex: 1; min-width: 0; overflow: hidden;
    background: #c9d3da; cursor: grab; touch-action: none;
  }
  #map.dragging { cursor: grabbing; }
  #map.picking { cursor: crosshair; }
  #tiles { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #tiles img {
    position: absolute;
    /* One pixel wider than the tile it holds, so fractional zoom does not open seams
       between exactly-adjacent tiles. The extra pixel overlaps the neighbour. */
    width: 257px; height: 257px; user-select: none; -webkit-user-drag: none;
  }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #overlay .hit { pointer-events: auto; cursor: pointer; }

  /* The contour layer is built once and moved by one transform, as the tiles are.
     `vector-effect` keeps a hairline a hairline while the group is scaled by the zoom. */
  #contours { position: absolute; inset: 0; pointer-events: none; }
  #contours path { fill: none; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  /* The ramp is pitched to read on satellite imagery. The street map is nearly white. */
  #contours.street { filter: brightness(.62) saturate(1.25); }
  /* Zoomed out far enough that a 1 m sheet would draw as a wash, only index lines stay. */
  #contours.sparse .minor { display: none; }

  .map-ui {
    position: absolute; z-index: 5;
    background: var(--panel);
    background: color-mix(in srgb, var(--panel) 94%, transparent);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    box-shadow: var(--shadow); backdrop-filter: blur(6px);
  }
  #layers { top: 12px; right: 12px; display: flex; overflow: hidden; }
  #layers button {
    border: 0; background: none; padding: 7px 12px; font: inherit; font-size: 12.5px;
    cursor: pointer; color: var(--muted);
  }
  #layers button + button { border-left: 1px solid var(--line); }
  #layers button.on { background: var(--accent); color: var(--on-accent); }

  #overlays { top: 51px; right: 12px; display: flex; overflow: hidden; }
  #overlays button {
    border: 0; background: none; padding: 7px 12px; font: inherit; font-size: 12.5px;
    cursor: pointer; color: var(--muted); display: flex; align-items: center; gap: 7px;
  }
  #overlays button.on { background: var(--accent); color: var(--on-accent); }
  #overlays button:disabled { opacity: .5; cursor: default; }
  #overlays .pip {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, #a8500f, #ffd166);
  }
  #overlays button.on .pip { background: #fff; }
  #overlays button.failed { color: var(--bad); }
  #overlays button.failed .pip { background: var(--bad); }

  #zoom { top: 90px; right: 12px; display: flex; flex-direction: column; overflow: hidden; }
  #zoom button {
    border: 0; background: none; width: 32px; height: 30px; font: inherit; font-size: 16px;
    cursor: pointer; color: var(--ink); display: grid; place-items: center;
  }
  #zoom button + button { border-top: 1px solid var(--line); }
  #zoom button:hover { background: var(--accent-wash); color: var(--accent-deep); }

  #legend { top: 12px; left: 12px; padding: 9px 11px; font-size: 12px; max-width: 220px; }
  #legend h4 {
    margin: 0 0 6px; font-size: 10px; text-transform: uppercase;
    letter-spacing: .07em; color: var(--muted); font-weight: 700;
  }
  #legend .lrow { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  #legend .sw { width: 16px; height: 10px; border-radius: 3px; flex: none; }
  #legend .sw.faint { opacity: .38; }
  #legend .sw.line { height: 0; border-top: 2.5px solid #e31a1c; border-radius: 0; }
  #legend .sw.dot { width: 10px; height: 10px; border-radius: 50%; }
  #legend .sub { margin: 1px 0 5px 24px; font-size: 11px; color: var(--muted); }

  #attribution {
    position: absolute; bottom: 0; right: 0; z-index: 5;
    background: var(--panel); background: color-mix(in srgb, var(--panel) 85%, transparent);
    font-size: 10.5px; color: var(--muted); padding: 2px 7px; border-top-left-radius: 5px;
  }
  #scale {
    position: absolute; bottom: 22px; right: 12px; z-index: 5;
    font-size: 11px; color: var(--ink); text-align: right;
    text-shadow: 0 0 3px var(--panel), 0 0 3px var(--panel), 0 0 3px var(--panel);
  }
  #scale .bar { height: 5px; border: 1.5px solid currentColor; border-top: 0; margin: 2px 0 0 auto; }

  #banner {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 6;
    background: var(--accent-deep); color: var(--on-accent); font-size: 12.5px;
    padding: 6px 14px; border-radius: 20px; box-shadow: var(--shadow); display: none;
  }
  #map.picking #banner { display: block; }

  /* A file may be dropped anywhere on the map, so the target is the map itself. */
  #dropveil {
    position: absolute; inset: 0; z-index: 8; display: none; place-items: center;
    background: color-mix(in srgb, var(--accent-deep) 45%, transparent);
    color: #fff; font-size: 15px; font-weight: 600;
  }
  #dropveil.on { display: grid; }
  #dropveil span { border: 2px dashed rgba(255,255,255,.8); border-radius: var(--radius); padding: 18px 26px; }

  /* ---------------- panel ---------------- */
  #panel {
    width: 384px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  #tabs { flex: none; display: none; border-bottom: 1px solid var(--line); padding: 0 8px; gap: 2px; }
  #tabs.on { display: flex; }
  #tabs button {
    font: inherit; font-size: 13px; border: 0; background: none; cursor: pointer;
    color: var(--muted); padding: 11px 12px 9px; border-bottom: 2px solid transparent;
  }
  #tabs button:hover { color: var(--ink); }
  #tabs button.on { color: var(--accent-deep); border-bottom-color: var(--accent); font-weight: 600; }
  #results { flex: 1; overflow-y: auto; overscroll-behavior: contain; }

  .sec { padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
  .sec:last-child { border-bottom: 0; }
  .sec > h3 {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    font-weight: 700; margin-bottom: 9px;
  }

  .card {
    border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 9px;
    cursor: pointer; background: var(--panel); overflow: hidden;
  }
  .card:last-child { margin-bottom: 0; }
  .card:hover { border-color: var(--accent); }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-wash); }
  .card .head {
    display: flex; align-items: center; gap: 9px; padding: 10px 12px;
    background: var(--raised); border-bottom: 1px solid var(--line);
  }
  .card.sel .head { background: var(--accent-wash); }
  .card .rank {
    width: 22px; height: 22px; border-radius: 50%; background: var(--accent-deep);
    color: var(--on-accent); font-size: 12px; font-weight: 700; display: grid;
    place-items: center; flex: none;
  }
  .card.alt .rank { background: var(--muted); }
  .card.rejected .rank { background: var(--bad); }
  .card .headline { font-size: 15px; font-weight: 650; flex: 1; }
  .card .headline em { font-style: normal; font-weight: 400; color: var(--muted); font-size: 12.5px; }
  .card .body { padding: 10px 12px; }
  .card .coords { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .chip {
    font-size: 10px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700;
    padding: 3px 8px; border-radius: 20px; background: var(--line-soft); color: var(--muted); flex: none;
  }
  .chip.high { background: var(--good-wash); color: var(--good); }
  .chip.medium { background: var(--warn-wash); color: var(--warn); }
  .chip.low { background: var(--bad-wash); color: var(--bad); }

  ul.why { margin: 8px 0 0; padding-left: 15px; color: var(--ink-soft); font-size: 12.5px; }
  ul.why li { margin: 2px 0; }

  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 10px;
    background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-sm);
    overflow: hidden;
  }
  /* Values line up along the bottom, so a two-line key does not push one number
     out of the row. */
  .stat {
    background: var(--panel); padding: 7px 9px; display: flex; flex-direction: column;
    justify-content: space-between; min-height: 52px;
  }
  .stat .k {
    font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600;
  }
  .stat .v { font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .stat .v small { font-weight: 400; color: var(--muted); font-size: 11px; }

  .say {
    margin-top: 10px; font-size: 12.5px; color: var(--ink-soft); background: var(--raised);
    border-left: 3px solid var(--accent); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 8px 10px;
  }
  .note { font-size: 12px; padding: 8px 10px; border-radius: var(--radius-sm); margin-top: 8px; }
  .note.warn { background: var(--warn-wash); color: var(--warn); }
  .note.bad { background: var(--bad-wash); color: var(--bad); }
  .note.info { background: var(--accent-wash); color: var(--accent-deep); }
  .note b { display: block; margin-bottom: 2px; }

  table.kv { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.kv td { padding: 4px 0; vertical-align: top; border-bottom: 1px solid var(--line-soft); }
  table.kv tr:last-child td { border-bottom: 0; }
  table.kv td:first-child { color: var(--muted); padding-right: 12px; }
  table.kv td:last-child { text-align: right; font-variant-numeric: tabular-nums; }

  details.more { margin-top: 8px; }
  details.more > summary {
    cursor: pointer; font-size: 12px; color: var(--accent-deep); list-style: none;
    padding: 5px 0; user-select: none;
  }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::before { content: "\25B8  "; }
  details.more[open] > summary::before { content: "\25BE  "; }

  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 24px; line-height: 1.6; }
  .empty strong { display: block; color: var(--ink); font-size: 14px; margin-bottom: 4px; }
  .working { display: flex; align-items: center; gap: 10px; font-size: 13.5px; padding: 16px; }
  .spinner {
    width: 15px; height: 15px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 980px) {
    main { flex-direction: column; }
    #map { height: 46vh; flex: none; }
    #panel { width: auto; border-left: 0; border-top: 1px solid var(--line); flex: 1; }
  }
</style>
</head>
<body>

<header>
  <span class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3c3.5 4.2 5.5 7.2 5.5 10a5.5 5.5 0 0 1-11 0c0-2.8 2-5.8 5.5-10z"/>
    </svg>
  </span>
  <h1>Pond Catchment Analysis</h1>
  <span class="spacer"></span>
  <span id="health"><span class="dot"></span><span class="txt">checking</span></span>
  <a id="docs-link" href="/docs" target="_blank" rel="noopener">API docs</a>
</header>

<div id="bar">
  <div class="ctl">
    <span class="lbl">Contour map</span>
    <input type="file" id="file" hidden
           accept=".kml,.kmz,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz">
    <button class="btn" id="choose">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
      </svg>
      Choose .kml or .kmz
    </button>
    <span id="filechip" hidden>
      <span class="name"></span><span class="size"></span>
      <button class="x" id="clear-file" title="Remove" aria-label="Remove file">&times;</button>
    </span>
  </div>

  <div class="ctl">
    <span class="lbl">Land cover and soil</span>
    <select id="cn-preset" aria-label="Land cover and soil"></select>
  </div>

  <div class="ctl">
    <span class="lbl">Pond depth</span>
    <span class="unit">
      <input type="number" id="target_depth_m" value="3" min="0.5" step="0.5" style="width:88px">
      <i>m</i>
    </span>
  </div>

  <div class="ctl adv-wrap">
    <span class="lbl">&nbsp;</span>
    <button class="btn" id="adv-toggle" aria-expanded="false">Advanced</button>
    <div id="adv" hidden>
      <div class="f">
        <label class="k" for="curve_number">Curve number</label>
        <input type="number" id="curve_number" value="75" min="30" max="98" step="1">
        <div class="sub" id="cn-note"></div>
      </div>
      <div class="f pair">
        <div>
          <label class="k" for="rainfall_mm">Rainfall mm/yr</label>
          <input type="number" id="rainfall_mm" placeholder="auto" min="1" step="10">
        </div>
        <div>
          <label class="k" for="grid_resolution">Grid size m</label>
          <input type="number" id="grid_resolution" placeholder="auto" min="2" max="20" step="0.5">
        </div>
      </div>

        <label class="k" for="top_n">Sites to return</label>
        <input type="number" id="top_n" value="3" min="1" max="10" step="1">

      <div class="f">
        <label class="check">
          <input type="checkbox" id="ensemble">
          <span>Cross-check on three grids</span>
        </label>
        <div class="sub" id="ensemble-note">
          Repeats the run at 5.0, 3.5 and 2.5 m for an error bar on the area. About three
          times slower.
        </div>
      </div>
      <div class="f">
        <label class="k">Pour point</label>
        <div class="row">
          <button class="btn" id="pick">Pick on the map</button>
          <code id="pour-txt" hidden></code>
          <button class="btn" id="pick-clear" hidden>Clear</button>

<main>
  <div id="map">
    <div id="tiles"></div>
    <svg id="contours" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
    <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>

      <button data-layer="satellite" class="on">Satellite</button>
      <button data-layer="street">Street</button>
    </div>

      <button id="contour-toggle" disabled title="Choose a contour map first">
        <span class="pip" aria-hidden="true"></span>
        <span class="txt">Contours</span>
      </button>

      <button id="zoom-in" title="Zoom in">+</button>
      <button id="zoom-out" title="Zoom out">&minus;</button>
      <button id="zoom-fit" title="Fit everything on screen">&#9634;</button>
    </div>
    <div id="legend" class="map-ui" hidden></div>
    <div id="scale"><span class="label"></span><div class="bar"></div></div>
    <div id="attribution"></div>
  </div>

  <aside id="panel">
    <div id="tabs"></div>
    <div id="results"></div>
  </aside>
</main>

<script>
"use strict";

/* Served by the service it talks to, so the deployed URL needs no configuration.
   Opened from disk, it falls back to a local run. */
const API = location.protocol === "file:" ? "http://localhost:8000" : "";
document.getElementById("docs-link").href = API + "/docs";

/* --------------------------------------------------------------------------
 * Web Mercator
 * ----------------------------------------------------------------------- */
const TILE = 256;
const MIN_ZOOM = 2;

// Both directions in *world fractions*, 0 to 1 across the whole map at any zoom, so the
// arithmetic below is zoom-independent and there is exactly one place that multiplies by
// a pixel count.
function project(lon, lat) {
  const s = Math.sin(Math.max(-85.05, Math.min(85.05, lat)) * Math.PI / 180);
  return [(lon + 180) / 360, 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)];
}
function unproject(fx, fy) {
  return [fx * 360 - 180, Math.atan(Math.sinh(Math.PI * (1 - 2 * fy))) * 180 / Math.PI];
}

const LAYERS = {
  satellite: {
    // Note the y/x order: Esri's REST tiles are {z}/{row}/{col}, not the XYZ convention.
    url: (z, x, y) =>
      `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`,
    max: 19,
    credit: "Imagery &copy; Esri, Maxar, Earthstar Geographics",
  },
  street: {
    url: (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`,
    max: 19,
    credit: "&copy; OpenStreetMap contributors",
  },
};

/* --------------------------------------------------------------------------
 * The map
 * ----------------------------------------------------------------------- */
const mapEl = document.getElementById("map");
const tilesEl = document.getElementById("tiles");
const overlayEl = document.getElementById("overlay");
const SVGNS = "http://www.w3.org/2000/svg";

const view = { fx: 0.5, fy: 0.5, zoom: 3, layer: "satellite" };
const tiles = new Map();      // "layer/z/x/y" -> <img>, kept so panning back is instant
const TILE_CACHE_MAX = 400;

let features = [];            // the GeoJSON features currently drawn
let selectedRank = 1;
let hoverRank = null;
let pourPoint = null;

function viewport() { return { w: mapEl.clientWidth, h: mapEl.clientHeight }; }
function pixelsPerWorld() { return TILE * Math.pow(2, view.zoom); }
function screenOf(lon, lat) {
  const { w, h } = viewport();
  const p = pixelsPerWorld();
  const [fx, fy] = project(lon, lat);
  return [(fx - view.fx) * p + w / 2, (fy - view.fy) * p + h / 2];
}
function lonLatOf(px, py) {
  const { w, h } = viewport();
  const p = pixelsPerWorld();
  return unproject(view.fx + (px - w / 2) / p, view.fy + (py - h / 2) / p);
}

function renderTiles() {
  const layer = LAYERS[view.layer];
  const { w, h } = viewport();
  // Tiles exist at whole zooms only; the fractional part becomes a CSS scale, which is
  // what makes wheel zoom continuous instead of stepping between levels.
  const tz = Math.max(0, Math.min(layer.max, Math.round(view.zoom)));
  const scale = Math.pow(2, view.zoom - tz);
  const world = TILE * Math.pow(2, tz);
  const left = view.fx * world - w / (2 * scale);
  const top = view.fy * world - h / (2 * scale);

  tilesEl.style.transform = `scale(${scale}) translate(${-left}px, ${-top}px)`;

  const span = Math.pow(2, tz);
  const x0 = Math.floor(left / TILE), x1 = Math.floor((left + w / scale) / TILE);
  const y0 = Math.max(0, Math.floor(top / TILE));
  const y1 = Math.min(span - 1, Math.floor((top + h / scale) / TILE));

  const wanted = new Set();
  for (let x = x0; x <= x1; x++) {
    for (let y = y0; y <= y1; y++) {
      // Wrap east to west so dragging across the antimeridian does not leave a void.
      const wx = ((x % span) + span) % span;
      const key = `${view.layer}/${tz}/${wx}/${y}`;
      wanted.add(key);
      let img = tiles.get(key);
      if (!img) {
        img = new Image();
        img.decoding = "async";
        img.alt = "";
        img.src = layer.url(tz, wx, y);
        // A tile the server does not have should leave the background, not a broken icon.
        img.addEventListener("error", () => { img.style.visibility = "hidden"; });
        tiles.set(key, img);
      }
      img.style.left = x * TILE + "px";
      img.style.top = y * TILE + "px";
      if (!img.parentNode) tilesEl.appendChild(img);
    }
  }
  for (const [key, img] of tiles) {
    if (!wanted.has(key) && img.parentNode) img.remove();
  }
  if (tiles.size > TILE_CACHE_MAX) {
    for (const [key, img] of tiles) {
      if (tiles.size <= TILE_CACHE_MAX) break;
      if (!wanted.has(key)) { img.remove(); tiles.delete(key); }
    }
  }
  document.getElementById("attribution").innerHTML = layer.credit;
}

/* --------------------------------------------------------------------------
 * The contour layer
 *
 * The contours are the evidence for the answer. A catchment boundary drawn on satellite
 * imagery cannot be checked by eye, because imagery does not show where the ridges are;
 * with the contours under it, a reader can see for themselves that the line runs along
 * the high ground and closes at the pond.
 *
 * They come from `POST /api/v1/contours`, which is the same parser the analysis uses, so
 * what is drawn is what was analysed rather than a second reading of the file.
 *
 * Unlike the answer, these lines never change. So they are laid out once in the Web
 * Mercator pixel grid at a fixed reference zoom and then moved by one SVG transform,
 * exactly as the tile layer is moved by one CSS transform. Rebuilding 30,000 vertices of
 * path data on every frame of a pan is the one thing that would make this map feel slow.
 * ----------------------------------------------------------------------- */
const CONTOUR_ZOOM = 22;
/* World pixels at this zoom are about 3.5 cm on the ground at Indian latitudes, forty
   times finer than the thinning the service already applied, so the path data rounds to
   whole units and the strings stay short. */

const contourEl = document.getElementById("contours");
const contourButton = document.getElementById("contour-toggle");

const contours = {
  file: null,       // the File these lines were read from, so a new upload invalidates them
  on: false,
  loading: false,
  error: null,
  meta: null,       // the response, minus the geometry
  origin: null,     // world-pixel offset the path data is written relative to
  spacing_m: null,  // mean distance between neighbouring contours, for the sparse rule
  group: null,
};

function contoursDrawn() { return contours.on && contours.group !== null; }

function buildContourLayer(collection) {
  const world = TILE * Math.pow(2, CONTOUR_ZOOM);
  const bbox = collection.bbox;
  // North-west corner of the sheet: the smallest fx and, because y grows southward, the
  // smallest fy. Subtracting it keeps path coordinates near zero instead of near 10^9.
  const [ox, oy] = project(bbox[0], bbox[3]).map((f) => Math.floor(f * world));

  // One path per distinct style rather than one per line. The service colours by
  // elevation, so a 32-level sheet has 32 styles and 1,355 lines, and merging them into
  // 32 multi-subpath elements is the difference between a layer the browser can composite
  // and one it has to walk.
  const byStyle = new Map();
  let length = 0;
  for (const feature of collection.features || []) {
    const props = feature.properties || {};
    const key = `${props.stroke}|${props["stroke-width"]}|${props["stroke-opacity"]}|${props.index}`;
    let entry = byStyle.get(key);
    if (!entry) {
      entry = { props, d: "" };
      byStyle.set(key, entry);
    }
    const line = feature.geometry.coordinates;
    let previous = null;
    for (let i = 0; i < line.length; i++) {
      const [fx, fy] = project(line[i][0], line[i][1]);
      const x = Math.round(fx * world - ox), y = Math.round(fy * world - oy);
      entry.d += (i ? "L" : "M") + x + " " + y;
      if (previous) length += Math.hypot(x - previous[0], y - previous[1]);
      previous = [x, y];
    }
  }

  const minor = svg("g", { class: "minor" });
  const major = svg("g", { class: "major" });
  for (const { props, d } of byStyle.values()) {
    const path = svg("path", {
      d: d,
      stroke: props.stroke || "#e08b1e",
      "stroke-width": props["stroke-width"] || 1,
      "stroke-opacity": props["stroke-opacity"] ?? 0.8,
    });
    (props.index ? major : minor).appendChild(path);
  }
  const group = svg("g", null);
  group.appendChild(minor);
  group.appendChild(major);
  contourEl.replaceChildren(group);

  contours.group = group;
  contours.origin = [ox, oy];
  // Mean spacing between neighbouring contours: the ground they cross divided by the
  // length of line crossing it. This is what decides when a 1 m sheet is too dense to
  // draw in full, and it holds for a 10 m sheet just as well.
  const metres = worldPixelMetres(bbox, world);
  const ground = Math.abs(
    (bbox[2] - bbox[0]) * (bbox[3] - bbox[1]) * 111320 * 110540 *
    Math.cos((bbox[1] + bbox[3]) / 2 * Math.PI / 180));
  contours.spacing_m = length > 0 ? ground / (length * metres) : null;
}

// Metres per world pixel at the reference zoom, at the middle of the sheet.
function worldPixelMetres(bbox, world) {
  const lat = (bbox[1] + bbox[3]) / 2;
  return 40075016.686 * Math.cos(lat * Math.PI / 180) / world;
}

function renderContours() {
  contourEl.classList.toggle("street", view.layer === "street");
  if (!contoursDrawn()) {
    contourEl.style.display = "none";
    return;
  }
  const { w, h } = viewport();
  const pixels = pixelsPerWorld();
  const scale = Math.pow(2, view.zoom - CONTOUR_ZOOM);
  contourEl.style.display = "";
  contourEl.setAttribute("width", w);
  contourEl.setAttribute("height", h);
  // A path coordinate u lands at u * scale + (origin * scale - centre * pixels + half a
  // viewport), which is the same mapping `screenOf` makes, folded into one transform.
  contours.group.setAttribute("transform",
    `translate(${(contours.origin[0] * scale - view.fx * pixels + w / 2).toFixed(2)} ` +
    `${(contours.origin[1] * scale - view.fy * pixels + h / 2).toFixed(2)}) scale(${scale})`);

  // Below three pixels apart the lines merge into a wash, so only the index contours are
  // drawn. On the 1 m sample sheet that is everything up to about a 3 km view.
  const lat = unproject(view.fx, view.fy)[1];
  const metresPerPixel = 40075016.686 * Math.cos(lat * Math.PI / 180) / pixels;
  const sparse = contours.spacing_m != null && contours.spacing_m / metresPerPixel < 3;
  if (sparse !== contourEl.classList.contains("sparse")) {
    contourEl.classList.toggle("sparse", sparse);
    // The legend says whether there are lines being held back, so it follows the zoom.
    buildLegend();
  }
}

async function loadContours() {
  const file = chosen;
  contours.loading = true;
  contours.error = null;
  syncContourButton();
  const form = new FormData();
  form.append("contour_map", file, file.name);
  try {
    const response = await fetch(API + "/api/v1/contours", { method: "POST", body: form });
    const body = await response.json();
    if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
    // The reader may have picked another file while this was in flight. Drawing the old
    // one over the new one's catchment would be worse than drawing nothing.
    if (chosen !== file) return;
    contours.file = file;
    contours.meta = body;
    buildContourLayer(body.geojson);
    // Before an analysis there is nothing else on the map, so this is also how a reader
    // finds their sheet without hunting for it.
    if (!features.length && body.bbox) fitBounds(body.bbox);
  } catch (error) {
    contours.error = String(error.message || error);
    contours.on = false;
  } finally {
    contours.loading = false;
    syncContourButton();
    buildLegend();
    render();
  }
}

function syncContourButton() {
  const ready = contours.file === chosen && contours.group !== null;
  contourButton.disabled = !chosen || contours.loading;
  contourButton.classList.toggle("on", contoursDrawn());
  contourButton.classList.toggle("failed", contours.error !== null);
  // A failure has to be readable without hovering: a button that turns nothing on and
  // says nothing looks like a broken button rather than an unreadable file.
  contourButton.querySelector(".txt").textContent =
    contours.loading ? "Reading" : contours.error ? "No contours" : "Contours";
  contourButton.title = !chosen
    ? "Choose a contour map first"
    : contours.error
    ? "Could not draw the contours. " + contours.error
    : contours.on
    ? "Hide the contour lines"
    : ready
    ? "Show the contour lines"
    : "Draw the contour lines from this file";
}

function forgetContours() {
  contours.file = null;
  contours.on = false;
  contours.error = null;
  contours.meta = null;
  contours.group = null;
  contours.spacing_m = null;
  contourEl.replaceChildren();
}

contourButton.onclick = () => {
  if (!chosen || contours.loading) return;
  contours.on = !contours.on;
  if (contours.on && contours.file !== chosen) {
    loadContours();
  } else {
    syncContourButton();
    buildLegend();
    render();
  }
};

/* ---- the GeoJSON overlay ---- */
function ringPath(ring) {
  let d = "";
  for (let i = 0; i < ring.length; i++) {
    const [x, y] = screenOf(ring[i][0], ring[i][1]);
    d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
  }
  return d + "Z";
}
function polygonPath(geometry) {
  const parts = geometry.type === "MultiPolygon" ? geometry.coordinates : [geometry.coordinates];
  let d = "";
  for (const polygon of parts) for (const ring of polygon) d += ringPath(ring);
  return d;
}
function linePath(geometry) {
  const lines = geometry.type === "MultiLineString" ? geometry.coordinates : [geometry.coordinates];
  let d = "";
  for (const line of lines) {
    for (let i = 0; i < line.length; i++) {
      const [x, y] = screenOf(line[i][0], line[i][1]);
      d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }
  }
  return d;
}
function svg(tag, attrs) {
  const node = document.createElementNS(SVGNS, tag);
  for (const key in attrs) if (attrs[key] != null) node.setAttribute(key, attrs[key]);
  return node;
}
function tip(node, text) {
  const title = document.createElementNS(SVGNS, "title");
  title.textContent = text;
  node.appendChild(title);
  return node;
}

// Areas first, then lines, then the points that sit on them. Within the areas the
// selected site goes last, so its outline is never buried under an alternative's fill.
function drawOrder(list) {
  const weight = (f) => {
    const role = f.properties.role;
    const selected = f.properties.rank === selectedRank;
    if (role === "catchment") return selected ? 1 : 0;
    if (role === "pond") return selected ? 3 : 2;
    if (role === "flow_path") return 4;
    return 5;
  };
  return list.map((f, i) => [f, i]).sort((a, b) => weight(a[0]) - weight(b[0]) || a[1] - b[1])
             .map(([f]) => f);
}

function renderOverlay() {
  const { w, h } = viewport();
  overlayEl.setAttribute("width", w);
  overlayEl.setAttribute("height", h);
  overlayEl.replaceChildren();

  // With contours underneath, the catchment fill stops being the thing that shows where
  // the ground is and starts being the thing hiding it. So the fills step back and the
  // outlines, which are what a reader is comparing against the ridges, do not.
  const wash = contoursDrawn() ? 0.45 : 1;

  let selectedLabel = null;

  for (const feature of drawOrder(features)) {
    const props = feature.properties || {};
    const geometry = feature.geometry;
    if (!geometry || !geometry.coordinates) continue;
    const selected = props.rank === selectedRank;
    const hovered = props.rank === hoverRank && !selected;
    const type = geometry.type;

    if (type === "Polygon" || type === "MultiPolygon") {
      const catchment = props.role === "catchment";
      const pond = props.role === "pond";
      const d = polygonPath(geometry);
      const width = catchment ? (selected ? 3.5 : hovered ? 2.5 : 1.8) : 1.5;

      // A dark casing under every outline. Satellite imagery is a busy background of
      // greens and greys, and a 2 px blue line laid straight on it disappears over a
      // field. The casing gives the line an edge to sit against wherever it runs.
      overlayEl.appendChild(svg("path", {
        d: d, fill: "none", stroke: "#0b1620",
        "stroke-opacity": selected || hovered ? 0.5 : 0.35,
        "stroke-width": width + 3, "stroke-linejoin": "round",
      }));

      // Selection is the loudest thing on this map on purpose. A reader clicking a
      // candidate is asking "which ground is this", and the answer has to be readable
      // over imagery, so the chosen catchment gets a strong fill and a heavy outline
      // while the others stay dashed and quiet without disappearing.
      const node = svg("path", {
        d: d,
        "fill-rule": "evenodd",
        fill: props.fill || "#a6cee3",
        // Every site's pond is drawn, so the one being read has to be the loud one: the
        // others stay visible enough to say "a pond would go here" and no louder.
        "fill-opacity": catchment
          ? (selected ? 0.42 : hovered ? 0.3 : 0.16) * wash
          : (props["fill-opacity"] ?? 0.55) * (!pond || selected || hovered ? 1 : 0.6),
        stroke: catchment && !selected && !hovered ? "#cfe6f5" : (props.stroke || "#1f78b4"),
        "stroke-width": width,
        "stroke-opacity": pond && !selected && !hovered ? 0.65 : null,
        "stroke-dasharray": catchment && !selected && !hovered ? "7 5" : null,
        "stroke-linejoin": "round",
        class: catchment || pond ? "hit" : null,
      });
      if (catchment || pond) attachSelection(node, props.rank);
      overlayEl.appendChild(tip(node, describe(props)));
      if (catchment && selected) selectedLabel = { props, geometry };
    } else if (type === "LineString" || type === "MultiLineString") {
      overlayEl.appendChild(tip(svg("path", {
        d: linePath(geometry),
        fill: "none",
        stroke: props.stroke || "#e31a1c",
        "stroke-width": props["stroke-width"] || 2,
        "stroke-opacity": selected ? 0.95 : 0.35,
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
      }), describe(props)));
    } else if (type === "Point") {
      const [x, y] = screenOf(geometry.coordinates[0], geometry.coordinates[1]);
      const group = svg("g", { class: "hit" });
      const radius = selected ? 10 : 7;
      if (selected) {
        group.appendChild(svg("circle", {
          cx: x, cy: y, r: radius + 5, fill: props["marker-color"] || "#08519c",
          "fill-opacity": 0.25,
        }));
      }
      group.appendChild(svg("circle", {
        cx: x, cy: y, r: radius,
        fill: props["marker-color"] || "#08519c",
        stroke: "#fff", "stroke-width": 2.5,
      }));
      if (props.rank != null) {
        const label = svg("text", {
          x: x, y: y + (selected ? 4 : 3.2), "text-anchor": "middle",
          "font-size": selected ? 12 : 10, "font-weight": "700", fill: "#fff",
          "font-family": "system-ui, sans-serif",
        });
        label.textContent = props.rank;
        group.appendChild(label);
      }
      tip(group, describe(props));
      attachSelection(group, props.rank);
      overlayEl.appendChild(group);
    }
  }

  // The area of the highlighted catchment, printed on the ground it covers. Without it a
  // reader has to look from the map to the panel and back to know what they just clicked.
  if (selectedLabel) {
    const at = labelAnchor(selectedLabel.geometry);
    if (at) {
      const text = `${formatArea(selectedLabel.props.area_ha)} ha`;
      const width = text.length * 7.6 + 20;
      overlayEl.appendChild(svg("rect", {
        x: at[0] - width / 2, y: at[1] - 13, width: width, height: 24, rx: 12,
        fill: "#08519c", "fill-opacity": 0.88,
      }));
      const label = svg("text", {
        x: at[0], y: at[1] + 4, "text-anchor": "middle", "font-size": 13,
        "font-weight": "650", fill: "#fff", "font-family": "system-ui, sans-serif",
      });
      label.textContent = text;
      overlayEl.appendChild(label);
    }
  }

  if (pourPoint) {
    const [x, y] = screenOf(pourPoint.lon, pourPoint.lat);
    overlayEl.appendChild(svg("path", {
      d: `M${x - 10} ${y}H${x + 10}M${x} ${y - 10}V${y + 10}`,
      stroke: "#b3261e", "stroke-width": 2.5, "stroke-linecap": "round",
    }));
    overlayEl.appendChild(svg("circle", {
      cx: x, cy: y, r: 5.5, fill: "none", stroke: "#b3261e", "stroke-width": 2.5,
    }));
  }
}

// Click to select, hover to preview. The drag guard matters: a browser still fires a
// click after a pan that started and ended on the same shape, and a catchment covers most
// of the screen, so without it every pan would reselect.
function attachSelection(node, rank) {
  if (rank == null) return;
  node.addEventListener("click", () => { if (!suppressClick) selectSite(rank, false); });
  node.addEventListener("pointerenter", () => { hoverRank = rank; render(); });
  node.addEventListener("pointerleave", () => {
    if (hoverRank === rank) { hoverRank = null; render(); }
  });
}

// The visual centre of the widest ring, which is where a label belongs. Not the centroid:
// a catchment is often a crescent around a valley, and its centroid falls outside it.
function labelAnchor(geometry) {
  const polygons = geometry.type === "MultiPolygon" ? geometry.coordinates : [geometry.coordinates];
  let best = null, bestSpan = -1;
  for (const polygon of polygons) {
    const ring = polygon[0];
    if (!ring || ring.length < 3) continue;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const [lon, lat] of ring) {
      const [x, y] = screenOf(lon, lat);
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    }
    const span = Math.min(maxX - minX, maxY - minY);
    if (span > bestSpan) { bestSpan = span; best = [(minX + maxX) / 2, (minY + maxY) / 2]; }
  }
  return bestSpan > 60 ? best : null;
}

function formatArea(value) {
  return value == null ? "?" : NUM.format(Number(value.toFixed(1)));
}

const ROLE_LABEL = {
  catchment: "Catchment", pond: "Pond at capacity", flow_path: "Longest flow path",
  pond_site: "Pond site",
};
function describe(props) {
  const lines = [];
  const label = ROLE_LABEL[props.role] || props.role;
  lines.push(props.rank ? `${label}, site ${props.rank}` : label);
  const skip = new Set(["role", "rank", "stroke", "fill", "fill-opacity", "stroke-width",
                        "marker-color", "marker-symbol", "warnings"]);
  for (const key in props) {
    if (skip.has(key) || props[key] == null) continue;
    lines.push(`${key.replace(/_/g, " ")}: ${props[key]}`);
  }
  return lines.join("\n");
}

function renderScale() {
  // Metres per pixel at the centre latitude: the equatorial figure shrunk by cos(lat),
  // which is the same correction the service's own projection applies.
  const lat = unproject(view.fx, view.fy)[1];
  const perPixel = 40075016.686 * Math.cos(lat * Math.PI / 180) / pixelsPerWorld();
  let metres = perPixel * 90;
  const magnitude = Math.pow(10, Math.floor(Math.log10(metres)));
  metres = [1, 2, 5, 10].find((f) => f * magnitude >= metres * 0.6) * magnitude;
  const el = document.getElementById("scale");
  el.querySelector(".label").textContent =
    metres >= 1000 ? (metres / 1000) + " km" : metres + " m";
  el.querySelector(".bar").style.width = (metres / perPixel).toFixed(0) + "px";
}

let frame = null;
function render() {
  if (frame) return;
  frame = requestAnimationFrame(() => {
    frame = null;
    renderTiles();
    renderContours();
    renderOverlay();
    renderScale();
  });
}

function fitBounds(bbox, pad) {
  const { w, h } = viewport();
  pad = pad ?? 48;
  const a = project(bbox[0], bbox[3]);
  const b = project(bbox[2], bbox[1]);
  const dx = Math.max(b[0] - a[0], 1e-9), dy = Math.max(b[1] - a[1], 1e-9);
  const zoom = Math.min(
    Math.log2(Math.max(w - 2 * pad, 50) / (TILE * dx)),
    Math.log2(Math.max(h - 2 * pad, 50) / (TILE * dy)),
  );
  view.fx = (a[0] + b[0]) / 2;
  view.fy = (a[1] + b[1]) / 2;
  view.zoom = Math.max(MIN_ZOOM, Math.min(LAYERS[view.layer].max + 0.5, zoom));
  render();
}

/* ---- interaction ---- */
let drag = null;
let suppressClick = false;
mapEl.addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  // The controls sit inside the map so they float over it. Capturing the pointer for a
  // drag would redirect the matching pointerup to the map, and the browser would never
  // synthesise the click, which left every button on the map dead until this guard.
  if (event.target.closest(".map-ui")) return;
  drag = { x: event.clientX, y: event.clientY, moved: 0 };
  suppressClick = false;
  mapEl.setPointerCapture(event.pointerId);
  mapEl.classList.add("dragging");
});
mapEl.addEventListener("pointermove", (event) => {
  if (!drag) return;
  const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  if (drag.moved >= 4) suppressClick = true;
  drag.x = event.clientX;
  drag.y = event.clientY;
  const p = pixelsPerWorld();
  view.fx -= dx / p;
  view.fy = Math.max(0, Math.min(1, view.fy - dy / p));
  render();
});
mapEl.addEventListener("pointerup", (event) => {
  const wasClick = drag && drag.moved < 4;
  drag = null;
  mapEl.classList.remove("dragging");
  if (wasClick && picking) {
    const rect = mapEl.getBoundingClientRect();
    const [lon, lat] = lonLatOf(event.clientX - rect.left, event.clientY - rect.top);
    setPourPoint(lon, lat);
    setPicking(false);
  }
});
mapEl.addEventListener("pointercancel", () => { drag = null; mapEl.classList.remove("dragging"); });

mapEl.addEventListener("wheel", (event) => {
  if (event.target.closest(".map-ui")) return;
  event.preventDefault();
  const rect = mapEl.getBoundingClientRect();
  zoomBy(event.deltaY > 0 ? -0.5 : 0.5, event.clientX - rect.left, event.clientY - rect.top);
}, { passive: false });

function zoomBy(delta, px, py) {
  const { w, h } = viewport();
  px = px ?? w / 2;
  py = py ?? h / 2;
  // Hold the ground under the cursor still: read its world fraction before the zoom
  // changes, then place the centre so that fraction lands back on the same pixel.
  const before = pixelsPerWorld();
  const fx = view.fx + (px - w / 2) / before;
  const fy = view.fy + (py - h / 2) / before;
  view.zoom = Math.max(MIN_ZOOM, Math.min(LAYERS[view.layer].max + 0.5, view.zoom + delta));
  const after = pixelsPerWorld();
  view.fx = fx - (px - w / 2) / after;
  view.fy = fy - (py - h / 2) / after;
  render();
}

document.getElementById("zoom-in").onclick = () => zoomBy(1);
document.getElementById("zoom-out").onclick = () => zoomBy(-1);
document.getElementById("zoom-fit").onclick = () => {
  const bbox = lastBBox || (contoursDrawn() ? contours.meta.bbox : null);
  if (bbox) fitBounds(bbox);
};
for (const button of document.querySelectorAll("#layers button")) {
  button.onclick = () => {
    view.layer = button.dataset.layer;
    for (const other of document.querySelectorAll("#layers button")) {
      other.classList.toggle("on", other === button);
    }
    render();
  };
}
new ResizeObserver(render).observe(mapEl);

/* --------------------------------------------------------------------------
 * Pour point

let picking = false;
function setPicking(on) {
  picking = on;
  mapEl.classList.toggle("picking", on);
  document.getElementById("pick").classList.toggle("on", on);
  document.getElementById("pick").textContent = on ? "Cancel" : "Pick on the map";
}
function setPourPoint(lon, lat) {
  pourPoint = lon == null ? null : { lon, lat };
  const text = document.getElementById("pour-txt");
  text.textContent = pourPoint ? `${pourPoint.lat.toFixed(5)}, ${pourPoint.lon.toFixed(5)}` : "";
  text.hidden = !pourPoint;
  document.getElementById("pick-clear").hidden = !pourPoint;

}
document.getElementById("pick").onclick = () => setPicking(!picking);

/* --------------------------------------------------------------------------
 * Small DOM helpers. Everything is built with textContent, never innerHTML, so a
 * filename or a message from the service cannot become markup.
 * ----------------------------------------------------------------------- */
function h(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const key in (attrs || {})) {
    if (key === "class") node.className = attrs[key];
    else if (key === "text") node.textContent = attrs[key];
    else if (key.startsWith("on")) node[key] = attrs[key];
    else if (attrs[key] !== null && attrs[key] !== undefined) node.setAttribute(key, attrs[key]);
  }
  for (const child of [].concat(children || [])) {
    if (child == null || child === false) continue;
    node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return node;
}
const NUM = new Intl.NumberFormat("en-GB");
function num(value, digits) {
  if (value == null || !isFinite(value)) return "n/a";
  return NUM.format(digits ? Number(value.toFixed(digits)) : Math.round(value));
}
function stat(key, value, unit) {
  return h("div", { class: "stat" }, [
    h("div", { class: "k", text: key }),
    h("div", { class: "v" }, [String(value), unit ? h("small", { text: " " + unit }) : null]),
  ]);
}
function rows(pairs) {
  return h("table", { class: "kv" }, pairs.filter(Boolean).map(([k, v]) =>
    h("tr", null, [h("td", { text: k }), h("td", { text: String(v) })])));
}
function noteList(messages, kind) {
  return messages.map((message) => h("div", { class: "note " + kind, text: message }));
}


/* --------------------------------------------------------------------------
 * Land cover, and the curve number behind it
 *
 * Standard SCS-CN values for cultivated and grazed land on the four hydrologic soil
 * groups, A (sand) to D (clay). The bar asks for the land, not the number, because a
 * planner knows what grows on the ground and not that it makes 82. The number itself is
 * in Advanced for anyone who has one.
 * ----------------------------------------------------------------------- */
const CN_PRESETS = [
  ["Row crops, loam", 75],
  ["Row crops, sandy soil", 65],
  ["Row crops, clay soil", 86],
  ["Paddy and small grain", 75],
  ["Grazing, good cover", 61],
  ["Grazing, overgrazed", 79],
  ["Scrub and open woodland", 55],
  ["Bare or fallow", 86],
  ["Village, roofs and yards", 82],
];

const preset = document.getElementById("cn-preset");
const cnInput = document.getElementById("curve_number");
const cnNote = document.getElementById("cn-note");
preset.append(...CN_PRESETS.map(([label, cn], i) =>
  h("option", { value: String(i), text: `${label} (CN ${cn})` })));
preset.append(h("option", { value: "custom", text: "Custom" }));

function syncCurveNumber(fromPreset) {
  if (fromPreset && preset.value !== "custom") cnInput.value = CN_PRESETS[Number(preset.value)][1];
  const match = CN_PRESETS.findIndex(([, cn]) => cn === Number(cnInput.value));
  if (!fromPreset) preset.value = match >= 0 ? String(match) : "custom";
  cnNote.textContent = "30 is sand under forest, 98 is concrete. Higher sheds more.";
}
preset.onchange = () => syncCurveNumber(true);
cnInput.oninput = () => syncCurveNumber(false);
syncCurveNumber(false);

/* ---- the Advanced popover ---- */
const advEl = document.getElementById("adv");
const advToggle = document.getElementById("adv-toggle");
function showAdvanced(on) {
  advEl.hidden = !on;
  advToggle.classList.toggle("on", on);
  advToggle.setAttribute("aria-expanded", String(on));
}
advToggle.onclick = () => showAdvanced(advEl.hidden);
document.addEventListener("pointerdown", (event) => {
  if (!advEl.hidden && !event.target.closest(".adv-wrap")) showAdvanced(false);
});

});
// Picking happens on the map, which the popover covers.
document.getElementById("pick").addEventListener("click", () => showAdvanced(false));
showAdvanced(false);

/* --------------------------------------------------------------------------
 * Rainfall
 *
 * Nobody has an annual rainfall figure to hand, and the service can read one. So the bar
 * does not ask: as soon as the contours are read, this fetches the ten-year mean for the
 * middle of the sheet and shows it. The request still leaves `rainfall_mm` out, so the
 * analysis reads the figure for the site it picks rather than the one shown here; the
 * two differ only inside one 25 km ERA5 cell. Advanced overrides it.
 * ----------------------------------------------------------------------- */
const rainInput = document.getElementById("rainfall_mm");
const derivedEl = document.getElementById("derived");
let autoRain = null;

async function lookupRainfall(bbox) {
  const lat = (bbox[1] + bbox[3]) / 2, lon = (bbox[0] + bbox[2]) / 2;
  autoRain = "loading";
  renderDerived();
  try {
    const url = `${API}/api/v1/rainfall?lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}`;
    const body = await (await fetch(url)).json();
    if (body.status !== "ok") throw new Error(body.detail);
    autoRain = {
      mm: body.annual_rainfall_mm,
      source: body.is_measured ? "ERA5, 10-year mean" : "regional climatology",
    };
  } catch {
    autoRain = null;
  }
  renderDerived();
}

function renderDerived() {
  const typed = rainInput.value.trim();
  if (typed) {
    derivedEl.replaceChildren("Rainfall ", h("b", { text: num(Number(typed)) + " mm/yr" }), " entered");
  } else if (autoRain === "loading") {
    derivedEl.textContent = "Reading rainfall records";
  } else if (autoRain) {
    derivedEl.replaceChildren("Rainfall ", h("b", { text: num(autoRain.mm) + " mm/yr" }),
                              " " + autoRain.source);
  } else {
    derivedEl.textContent = "";
  }
}
rainInput.oninput = renderDerived;

/* --------------------------------------------------------------------------
 * Results
 *
 * Three tabs rather than one column: the sites, the water they yield, and the numbers
 * the run was built from. Everything follows the selected site, so clicking a shape on
 * the map changes the water figures with it.
 * ----------------------------------------------------------------------- */
const resultsEl = document.getElementById("results");
const tabsEl = document.getElementById("tabs");
const TABS = [["sites", "Sites"], ["water", "Water"], ["data", "Data"]];
let tab = "sites";
let lastBody = null;
let lastBBox = null;

function sites() {
  return lastBody ? [lastBody.recommended_site, ...lastBody.alternative_sites] : [];
}
function currentSite() {
  return sites().find((s) => s.rank === selectedRank) || sites()[0];
}

function siteCard(site, full) {
  const c = site.catchment, s = site.storage, r = site.runoff;
  const rejected = !site.is_recommended;

  const body = h("div", { class: "body" }, [
    h("div", { class: "coords", text: `${site.location.lat.toFixed(5)}, ${site.location.lon.toFixed(5)}` }),
    h("ul", { class: "why" }, (site.why || []).slice(0, 3).map((reason) => h("li", { text: reason }))),
    h("div", { class: "stats" }, [
      stat("Capacity", num(s.capacity_m3), "m³"),
      stat("Annual runoff", num(r.annual_runoff_m3), "m³"),
      stat("Fills", r.fill_ratio < 0 ? "n/a" : num(r.fill_ratio, 2) + "×"),
    ]),
  ]);

  if (full) {
    body.appendChild(h("details", { class: "more" }, [
      h("summary", { text: "Catchment detail" }),
      rows([
        ["Relief", num(c.relief_m, 1) + " m"],
        ["Longest flow path", num(c.longest_flow_path_m) + " m"],
        ["Time of concentration", num(c.time_of_concentration_min, 1) + " min"],
        ["Above the watercourse", site.height_above_trunk_m == null
          ? "n/a" : num(site.height_above_trunk_m, 1) + " m"],
        ["Edge contact", num(c.edge_contact_pct, 1) + " %"],
        ["Water surface", num(s.surface_area_m2) + " m²"],
        ["Usable depth", num(s.usable_depth_m ?? s.max_depth_m, 2) + " m"],
      ]),
    ]));
    if (c.is_lower_bound) {
      body.appendChild(h("div", { class: "note warn", text:
        "The catchment runs off the edge of the sheet, so this area is a floor." }));
    }
  }
  for (const warning of site.warnings || []) {
    body.appendChild(h("div", { class: "note " + (rejected ? "bad" : "warn"), text: warning }));
  }

  return h("div", {
    class: "card" + (full ? "" : " alt") + (rejected ? " rejected" : "") +
           (site.rank === selectedRank ? " sel" : ""),
    onclick: () => selectSite(site.rank, true),
    onpointerenter: () => { hoverRank = site.rank; render(); },
    onpointerleave: () => { if (hoverRank === site.rank) { hoverRank = null; render(); } },
  }, [
    h("div", { class: "head" }, [
      h("div", { class: "rank", text: String(site.rank) }),
      h("div", { class: "headline" }, [
        num(c.area_ha, 1) + " ha",
        h("em", { text: c.area_uncertainty_ha != null ? ` ± ${num(c.area_uncertainty_ha, 1)}` : "" }),
      ]),
      h("span", { class: "chip " + c.confidence, text: c.confidence }),
    ]),
    body,
  ]);
}

function sitesView() {
  const body = lastBody;
  const parts = [h("div", { class: "sec" }, [
    h("h3", { text: "Recommended site" }),
    siteCard(body.recommended_site, true),
  ])];
  if (body.alternative_sites.length) {
    parts.push(h("div", { class: "sec" }, [
      h("h3", { text: "Alternatives" }),
      ...body.alternative_sites.map((site) => siteCard(site, false)),
    ]));
  }
  if (body.warnings.length) {
    parts.push(h("div", { class: "sec" }, [
      h("h3", { text: "Warnings" }),
      ...noteList(body.warnings, "warn"),

}

function waterView() {
  const site = currentSite(), r = site.runoff, s = site.storage;
  return [
    h("div", { class: "sec" }, [
      h("h3", { text: `Rainfall, site ${site.rank}` }),

        ["Annual rainfall", num(r.rainfall_mm) + " mm"],
        ["Rain days", num(r.rain_days)],
        ["Runoff days", num(r.contributing_days)],

      ]),
    ]),
    h("div", { class: "sec" }, [
      h("h3", { text: "Runoff" }),
      rows([
        ["Curve number", num(r.curve_number, 1)],
        ["Retention S", num(r.retention_mm, 1) + " mm"],
        ["Initial abstraction", num(r.initial_abstraction_mm, 1) + " mm"],
        ["Runoff depth", num(r.runoff_depth_mm, 1) + " mm"],
        ["Runoff coefficient", num(r.runoff_coefficient * 100, 1) + " %"],

        ["Water surface", num(s.surface_area_m2) + " m²"],

        ["Fills per year", r.fill_ratio < 0 ? "n/a" : num(r.fill_ratio, 2)],

      h("details", { class: "more" }, [

}

function dataView() {
  const body = lastBody, input = body.input, dem = body.dem;
  const parts = [
    h("div", { class: "sec" }, [
      h("h3", { text: "Contour map" }),
      rows([
        ["File", input.filename],
        ["Lines", NUM.format(input.contour_count)],
        ["Points", NUM.format(input.vertex_count)],
        ["Elevations from", input.elevation_source.replace(/_/g, " ")],
        ["Interval", input.interval_m ? input.interval_m + " m" : "not stated"],
        ["Range", `${input.elevation_range_m[0]} to ${input.elevation_range_m[1]} m`],
        ["Area mapped", num(input.mapped_area_ha, 1) + " ha"],
      ]),
    ]),
    h("div", { class: "sec" }, [

        ["Cells", `${dem.shape[0]} × ${dem.shape[1]}`],

function renderPanel() {
  if (!lastBody) return;
  tabsEl.classList.add("on");
  tabsEl.replaceChildren(...TABS.map(([key, label]) => h("button", {
    class: key === tab ? "on" : "",
    text: label,
    onclick: () => { tab = key; renderPanel(); },
  })));
  const content = tab === "water" ? waterView() : tab === "data" ? dataView() : sitesView();
  resultsEl.replaceChildren(...content);
  resultsEl.scrollTop = 0;
}

function renderResults(body, refit) {
  lastBody = body;
  features = body.geojson.features || [];
  lastBBox = body.geojson.bbox || null;
  buildLegend();
  renderPanel();
  if (refit && lastBBox) fitBounds(lastBBox); else render();
}

// `zoom` is false when the click came from the map. Clicking a shape you can already see
// and having the view jump is disorienting; clicking a card, where the shape may be off
// screen, it is the point.
function selectSite(rank, zoom) {
  if (rank == null) return;
  selectedRank = rank;
  if (lastBody) {
    const scroll = resultsEl.scrollTop;
    renderPanel();
    if (!zoom) resultsEl.scrollTop = scroll;
  }
  if (zoom) {
    const catchment = features.find(
      (f) => f.properties.role === "catchment" && f.properties.rank === rank);
    if (catchment) fitBounds(bboxOf(catchment));
  }
  render();
}

function bboxOf(feature) {
  let minLon = 180, minLat = 90, maxLon = -180, maxLat = -90;
  (function walk(coordinates) {
    if (typeof coordinates[0] === "number") {
      minLon = Math.min(minLon, coordinates[0]); maxLon = Math.max(maxLon, coordinates[0]);
      minLat = Math.min(minLat, coordinates[1]); maxLat = Math.max(maxLat, coordinates[1]);
      return;
    }
    coordinates.forEach(walk);
  })(feature.geometry.coordinates);
  return [minLon, minLat, maxLon, maxLat];
}

function buildLegend() {
  const legend = document.getElementById("legend");
  legend.hidden = !features.length && !contoursDrawn();
  if (legend.hidden) return;
  legend.replaceChildren(h("h4", { text: "On the map" }));

  const row = (label, colour, cls, border) => {
    const swatch = h("div", { class: cls });
    if (colour) swatch.style.background = colour;
    if (border) swatch.style.border = "1.5px " + border;
    legend.appendChild(h("div", { class: "lrow" }, [swatch, h("span", { text: label })]));
  };

  if (features.length) {
    row("Selected catchment", "#a6cee3", "sw", "solid #1f78b4");
    row("Other catchments", "#a6cee3", "sw faint", "dashed #4b6b80");
    row("Pond at capacity", "#3182bd", "sw", "solid #08519c");
    row("Longest flow path", null, "sw line", null);
    row("Pond site", "#08519c", "sw dot", null);
  }

  if (contoursDrawn()) {
    // The ramp is the only thing on the map saying which way is uphill, so the legend
    // carries the two numbers that anchor it.
    const meta = contours.meta;
    const [low, high] = meta.elevation_range_m;
    row(`Contours, ${num(low)} to ${num(high)} m`,
        "linear-gradient(to right, #a8500f, #e08b1e, #ffd166)", "sw", null);
    const detail = meta.interval_m
      ? `Every ${num(meta.interval_m, 2)} m`
      : `${NUM.format(meta.level_count)} levels`;
    legend.appendChild(h("div", { class: "sub", text: detail }));
    if (contourEl.classList.contains("sparse")) {
      legend.appendChild(h("div", { class: "sub", text: "Zoom in for the lines between." }));
    }
  }
}

/* --------------------------------------------------------------------------
 * The file, and the request it goes into
 * ----------------------------------------------------------------------- */
const fileInput = document.getElementById("file");
const chipEl = document.getElementById("filechip");
const chooseButton = document.getElementById("choose");
const runButton = document.getElementById("run");
const progEl = document.getElementById("prog");
const veil = document.getElementById("dropveil");
let chosen = null;

function size(bytes) {
  return bytes >= 1e6 ? (bytes / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(bytes / 1e3)) + " kB";
}

function chooseFile(file) {
  chosen = file;
  forgetContours();
  features = [];
  lastBody = null;
  lastBBox = null;
  autoRain = null;
  tabsEl.classList.remove("on");
  showEmpty();
  buildLegend();
  render();

  chipEl.hidden = false;
  chipEl.querySelector(".name").textContent = file.name;
  chipEl.querySelector(".size").textContent = size(file.size);
  chooseButton.hidden = true;
  runButton.disabled = false;

  // The lines are what the reader checks the boundary against, and reading them takes
  // under a second, so they are drawn without being asked for. Their bbox is also how
  // the rainfall gets looked up before anything is analysed.
  contours.on = true;
  syncContourButton();
  loadContours().then(() => {
    if (contours.file === file && contours.meta && contours.meta.bbox) {
      lookupRainfall(contours.meta.bbox);
    }
  });
  renderDerived();
}

function clearFile() {
  chosen = null;
  forgetContours();
  features = [];
  lastBody = null;
  autoRain = null;
  chipEl.hidden = true;
  chooseButton.hidden = false;
  runButton.disabled = true;
  tabsEl.classList.remove("on");
  showEmpty();
  renderDerived();
  syncContourButton();
  buildLegend();
  render();
}

chooseButton.onclick = () => fileInput.click();
document.getElementById("clear-file").onclick = () => clearFile();
fileInput.onchange = () => { if (fileInput.files[0]) chooseFile(fileInput.files[0]); };

// The map is the drop target, and a file dropped anywhere else must not navigate away.
let dragDepth = 0;
mapEl.addEventListener("dragenter", (event) => {
  event.preventDefault(); dragDepth++; veil.classList.add("on");
});
mapEl.addEventListener("dragover", (event) => event.preventDefault());
mapEl.addEventListener("dragleave", () => { if (--dragDepth <= 0) veil.classList.remove("on"); });
mapEl.addEventListener("drop", (event) => {
  event.preventDefault();
  dragDepth = 0;
  veil.classList.remove("on");
  const file = event.dataTransfer.files[0];
  if (file) chooseFile(file);
});
for (const type of ["dragover", "drop"]) {
  document.addEventListener(type, (event) => event.preventDefault());
}

function optional(form, id, name) {
  const value = document.getElementById(id).value.trim();
  if (value !== "") form.append(name || id, value);
}

function showEmpty() {
  resultsEl.replaceChildren(h("div", { class: "empty" }, [
    h("strong", { text: chosen ? "Ready" : "No contour map yet" }),
    chosen ? "Press Analyse." : "Choose a .kml or .kmz file, or drop one on the map.",
  ]));
}

const ensembleBox = document.getElementById("ensemble");

runButton.onclick = async () => {
  if (!chosen) return;
  const form = new FormData();
  form.append("contour_map", chosen, chosen.name);
  form.append("ensemble", ensembleBox.checked ? "true" : "false");
  optional(form, "top_n");
  optional(form, "curve_number");
  optional(form, "target_depth_m");
  optional(form, "rainfall_mm");
  optional(form, "grid_resolution");
  if (pourPoint) {
    form.append("lat", pourPoint.lat);
    form.append("lon", pourPoint.lon);
  }

  runButton.disabled = true;
  progEl.classList.add("on");
  tabsEl.classList.remove("on");
  features = [];
  lastBody = null;
  buildLegend();
  render();

  const started = Date.now();
  const label = h("span", { text: "Analysing" });
  resultsEl.replaceChildren(h("div", { class: "working" }, [h("div", { class: "spinner" }), label]));
  const ticker = setInterval(() => {
    label.textContent = `Analysing, ${((Date.now() - started) / 1000).toFixed(1)} s`;
  }, 100);

  try {
    const response = await fetch(API + "/api/v1/analyzeContour", { method: "POST", body: form });
    const body = await response.json();
    clearInterval(ticker);
    if (!response.ok) {
      resultsEl.replaceChildren(h("div", { class: "sec" }, [
        h("h3", { text: "That map could not be analysed" }),
        h("div", { class: "note bad" }, [
          h("b", { text: body.code || `HTTP ${response.status}` }),
          body.detail || "The request failed.",
        ]),
        body.hint ? h("div", { class: "note info", text: body.hint }) : null,
      ]));
      return;
    }
    selectedRank = 1;
    tab = "sites";
    renderResults(body, true);
  } catch (error) {
    clearInterval(ticker);
    resultsEl.replaceChildren(h("div", { class: "sec" }, [
      h("h3", { text: "The service did not answer" }),
      h("div", { class: "note bad", text: String(error) }),
      h("div", { class: "note info", text: "Is the API running at " + (API || location.origin) + "?" }),
    ]));
  } finally {
    clearInterval(ticker);
    progEl.classList.remove("on");
    runButton.disabled = false;
  }
};

/* --------------------------------------------------------------------------
 * Startup
 * ----------------------------------------------------------------------- */
(async function health() {
  const el = document.getElementById("health");
  try {
    const body = await (await fetch(API + "/health")).json();
    el.className = "up";
    el.querySelector(".txt").textContent = "API v" + body.version;
    applyEnsembleCapability(body);
  } catch {
    el.className = "down";
    el.querySelector(".txt").textContent = "API not reachable";
  }
})();

// The cross-check switch follows the host, not the HTML. On a small container
// `allow_ensemble` is false and an `ensemble=true` run is refused with a 422, so a box
// ticked in the markup would fail every upload on a page that otherwise looks healthy.
// Shipping it off and letting /health turn it on means the worst case is an analysis
// without its error bar, which is the run this host was going to do anyway.
//
// Older builds report neither field and are read as available and on, which is what
// they were.
function applyEnsembleCapability(body) {
  if (body.ensemble_available === false) {
    ensembleBox.disabled = true;
    document.getElementById("ensemble-note").textContent =
      "Not available on this host: three grids need more memory than this container has. "
      + "The area comes back without an error bar and confidence reads unassessed.";
    return;
  }
  ensembleBox.checked = body.ensemble_default !== false;
}

showEmpty();
// Central India, where the sample sheet is, so the page opens on ground rather than on
// an ocean while it waits for a file.
fitBounds([78.0, 19.0, 84.0, 24.0]);
syncContourButton();
</script>
</body>
</html>
